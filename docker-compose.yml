services:
  email-api:
    image: ghcr.io/mikayil-dev/email-api:latest
    container_name: email-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3411:3000"
    environment:
      - PORT=3000
      - CONFIG_FILE=/config/origins.json
      # Site manifests of vps-caddy: every site with a contactEmail is allowed.
      - SITES_DIR=/config/sites
      - TRUST_PROXY=true
      - RATE_LIMIT=5
      - RATE_WINDOW_MS=60000
    volumes:
      - ./origins.json:/config/origins.json:ro
      - /srv/vps-caddy/sites:/config/sites:ro
